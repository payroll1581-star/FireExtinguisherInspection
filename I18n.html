  var lang = 'th';
  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (saved === 'en' || saved === 'th') lang = saved;
  } catch (e) { /* ใช้ค่าเริ่มต้น */ }

  function t(key, params) {
    var v = DICT[lang][key];
    if (v === undefined) v = TH[key];
    if (v === undefined) return key;
    if (lang === 'en' && v.indexOf('|') !== -1) {
      var parts = v.split('|');
      v = params && Number(params.n) === 1 ? parts[0] : parts[1];
    }
    if (params) v = v.replace(/\{(\w+)\}/g, function (m, k) { return params[k] === undefined ? m : params[k]; });
    return v;
  }

  /* แปลข้อความจากเซิร์ฟเวอร์ (ไทย) ตามภาษาปัจจุบัน; ไม่รู้จัก → คืนค่าเดิม */
  function srv(msg) {
    if (lang !== 'en' || !msg) return msg;
    for (var i = 0; i < SERVER_EN.length; i++) {
      var rule = SERVER_EN[i];
      if (typeof rule[0] === 'string') { if (msg === rule[0]) return rule[1]; continue; }
      var m = msg.match(rule[0]);
      if (m) return rule[1].replace(/\$(\d)/g, function (x, n) { return m[Number(n)]; });
    }
    return msg;
  }

  function checkTitle(s) { return lang === 'en' && CHECK_TITLE_EN[s] ? CHECK_TITLE_EN[s] : s; }
  function checkHow(s) { return lang === 'en' && CHECK_HOW_EN[s] ? CHECK_HOW_EN[s] : s; }
  function typeName(s) { return lang === 'en' && TYPE_EN[s] ? TYPE_EN[s] : s; }
  /* "ข้อที่ไม่ผ่าน" ในชีตเป็นชื่อรายการคั่นด้วย ", " */
  function failedItems(s) {
    if (lang !== 'en' || !s) return s;
    return String(s).split(', ').map(checkTitle).join(', ');
  }
  /* ตำแหน่งที่เซิร์ฟเวอร์ประกอบมาแล้ว (มี "ชั้น X") */
  function locStr(s) {
    if (lang !== 'en' || !s) return s;
    return String(s).replace(/ชั้น (\S+)/g, 'Floor $1');
  }

  function applyStatic() {
    var root = document.documentElement;
    root.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-html]'), function (el) {
      el.innerHTML = t(el.getAttribute('data-i18n-html'));
    });
    /* data-i18n-attr="placeholder:key;aria-label:key" */
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-attr]'), function (el) {
      el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
        var i = pair.indexOf(':');
        if (i > 0) el.setAttribute(pair.slice(0, i).trim(), t(pair.slice(i + 1).trim()));
      });
    });
    /* ปุ่มสลับภาษา: แสดงภาษาที่จะสลับไป */
    Array.prototype.forEach.call(document.querySelectorAll('.lang-btn'), function (b) {
      b.textContent = lang === 'th' ? 'EN' : 'ไทย';
      b.setAttribute('lang', lang === 'th' ? 'en' : 'th');
      b.setAttribute('aria-label', t('lang.switchTo'));
      b.setAttribute('title', t('lang.switchTo'));
    });
  }

  function setLang(l) {
    if (l !== 'th' && l !== 'en') return;
    lang = l;
    try { localStorage.setItem(LS_KEY, JSON.stringify(l)); } catch (e) { /* ไม่เป็นไร */ }
    applyStatic();
  }

  return {
    t: t, srv: srv, setLang: setLang, applyStatic: applyStatic,
    getLang: function () { return lang; },
    checkTitle: checkTitle, checkHow: checkHow, typeName: typeName, failedItems: failedItems, locStr: locStr,
    _dict: DICT, _server: SERVER_EN
  };
})();
