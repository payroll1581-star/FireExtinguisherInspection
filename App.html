<script>
/* App.html — ฝั่งหน้าเว็บ (Single Page App) ของระบบตรวจถังดับเพลิง */
(function () {
  'use strict';

  var D = document.body.dataset;
  if (!window.I18n) {
    // ไฟล์ I18n ไม่ถูกโหลด (ยังไม่ได้สร้างไฟล์ I18n หรือ Code.gs เก่า) — แสดงข้อความแทนหน้าจอว่าง
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;line-height:1.6;color:#b71c1c">' +
      '<h2>โหลดระบบไม่สมบูรณ์ / Incomplete install</h2>' +
      '<p>ไม่พบไฟล์ I18n — สร้างไฟล์ HTML ชื่อ <b>I18n</b> และอัปเดต <b>Code.gs</b> (รายการ allowed ใน include) แล้ว Deploy เวอร์ชันใหม่</p>' +
      '<p>I18n file missing: add an HTML file named <b>I18n</b>, update <b>Code.gs</b>, then deploy a new version.</p></div>';
    return;
  }
  var I = window.I18n;
  var t = I.t;
  var LS = {
    TOKEN: 'fe_token', EXP: 'fe_exp', USER: 'fe_user', LAST_USER: 'fe_last_user',
    CACHE: 'fe_cache', QUEUE: 'fe_queue', FAILED: 'fe_failed', THEME: 'fe_theme',
  };
  var ID_RE = /^[A-Z0-9][A-Z0-9_-]{0,39}$/;
  var STATUS_ICON = { NORMAL: 'check', DAMAGED: 'alert', PENDING: 'clock', all: 'ext' };
  function statusText(st) { return ({ NORMAL: 1, DAMAGED: 1, PENDING: 1 })[st] ? t('st.' + st) : st; }
  function expiryText(ex) { return ({ EXPIRED: 1, SOON: 1 })[ex] ? t('ex.' + ex) : ''; }
  var EXPIRY_ICON = { EXPIRED: 'ban', SOON: 'hourglass' };
  var QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  var QR_LIB_SRI = 'sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU';

  var state = {
    token: null, user: null, cache: null, view: '',
    current: null, scanner: null, scanLocked: false,
    dash: null, dashFilter: { building: '', floor: '', list: 'problem' },
    log: null, flushing: false,
    initialId: D.initialId || '', initialView: D.initialView || '',
  };

  /* ============================== Utilities ============================== */

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function ico(name, cls) {
    return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }
  function lsGet(k, fallback) {
    try { var v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function isAdmin() { return !!(state.user && state.user.role === 'ADMIN'); }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  /* ไทย: ปี พ.ศ. + "น." / อังกฤษ: ปี ค.ศ. (ข้อมูลในชีตเก็บเป็น ค.ศ. เสมอ) */
  var DATE_OPTS = { timeZone: 'Asia/Bangkok', day: '2-digit', month: '2-digit', year: 'numeric' };
  var DATE_FMT = {
    th: new Intl.DateTimeFormat('th-TH-u-ca-buddhist-nu-latn', DATE_OPTS),
    en: new Intl.DateTimeFormat('en-GB', DATE_OPTS),
  };
  var fmtTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false });
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    var suffix = t('unit.pm');
    return DATE_FMT[I.getLang()].format(d) + ' ' + fmtTime.format(d) + (suffix ? ' ' + suffix : '');
  }
  function buddhistYear(y) { return I.getLang() === 'th' ? Number(y) + 543 : Number(y); }
  function fmtYmd(ymd) {
    if (!ymd) return '-';
    var p = ymd.split('-');
    return p[2] + '/' + p[1] + '/' + buddhistYear(p[0]);
  }
  function currentYm() { return new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 7); }
  function daysText(n) {
    if (n < 0) return t('days.over', { n: -n });
    if (n === 0) return t('days.today');
    return t('days.left', { n: n });
  }
  function locText(it) {
    return [it.building, it.floor ? t('floor', { f: it.floor }) : '', it.location].filter(Boolean).join(' · ');
  }
  function naturalCmp(a, b) { return String(a).localeCompare(String(b), I.getLang(), { numeric: true }); }

  /* ============================== UI helpers ============================== */

  var toastTimer = null;
  function toast(msg, ms) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 3200);
  }
  function loading(on, text) {
    $('loading').hidden = !on;
    if (text) $('loading-text').textContent = text;
  }
  var modalReturnFocus = null;
  function openModal(title, html) {
    modalReturnFocus = document.activeElement;
    $('modal-title').textContent = title;
    $('modal-body').innerHTML = html;
    $('modal').hidden = false;
    $('modal-close').focus();
  }
  function closeModal() {
    $('modal').hidden = true;
    $('modal-body').innerHTML = '';
    if (modalReturnFocus && document.body.contains(modalReturnFocus)) { try { modalReturnFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    modalReturnFocus = null;
  }
  function onModalKey(e) {
    if ($('modal').hidden) return;
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key !== 'Tab') return;
    var f = $('modal').querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function statusChip(st) { return '<span class="chip ' + esc(st) + '">' + ico(STATUS_ICON[st] || 'check') + esc(statusText(st)) + '</span>'; }
  function expiryChip(it) { return expiryText(it.expiry) ? '<span class="chip ' + esc(it.expiry) + '">' + ico(EXPIRY_ICON[it.expiry]) + esc(expiryText(it.expiry)) + '</span>' : ''; }
  function expiryDetailsHtml(it) {
    if (!it.expiryDetails || !it.expiryDetails.length) return '';
    return '<div class="muted small" style="margin-top:8px">' + it.expiryDetails.map(function (d) {
      var label = d.kind === 'service' ? t('kind.service') : t('kind.expiry');
      var style = d.daysLeft < 0 ? ' class="hl"' : '';
      return label + ': ' + fmtYmd(d.date) + ' <span' + style + '>(' + daysText(d.daysLeft) + ')</span>';
    }).join('<br>') + '</div>';
  }

  /* ============================== Server ============================== */

  function appErr(code, raw) { var e = new Error(I.srv(raw) || t('err.generic')); e.code = code; e.raw = raw || ''; return e; }

  function call(action, payload) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(appErr('NETWORK', t('err.noServer')));
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return reject(appErr('ERROR', t('err.noData')));
          if (res.ok) return resolve(res.data);
          if (res.code === 'AUTH') handleAuthExpired();
          reject(appErr(res.code, res.error));
        })
        .withFailureHandler(function (err) {
          // api() ไม่ throw ออกมา ดังนั้น failure = เครือข่าย/หมดเวลา → ถือเป็นออฟไลน์
          var e = appErr('NETWORK', t('err.network'));
          e.detail = err && err.message;
          reject(e);
        })
        .api(action, state.token || '', payload || {});
    });
  }

  /* ============================== Network / environment ============================== */

  function updateNet() {
    var on = navigator.onLine !== false;
    $('net-dot').classList.toggle('off', !on);
    $('offline-banner').hidden = on;
    if (on) flushQueue();
  }

  function detectInApp() {
    var ua = navigator.userAgent || '';
    if (/\bLine\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|; wv\)/i.test(ua)) $('inapp-banner').hidden = false;
  }

  /* ============================== Navigation ============================== */

  var NAV_OF = { home: 'home', scan: 'home', inspect: 'home', done: 'home', dashboard: 'dashboard', log: 'log' };

  function show(view) {
    if (state.view === 'scan' && view !== 'scan') stopScanner();
    state.view = view;
    document.body.setAttribute('data-view', view);
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) { v.hidden = v.id !== 'view-' + view; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
      var on = b.getAttribute('data-nav') === NAV_OF[view];
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('bottomnav').hidden = !state.token || view === 'login';
    window.scrollTo(0, 0);
    var hd = view === 'login' ? null : document.querySelector('#view-' + view + ' h2, #view-' + view + ' .tank-id');
    if (hd) { hd.setAttribute('tabindex', '-1'); try { hd.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }

  function confirmLeaveInspect() {
    var c = state.current;
    if (state.view === 'inspect' && c && Object.keys(c.answers).length) {
      return window.confirm(t('insp.confirmLeave', { id: c.item.id }));
    }
    return true;
  }

  function onNav(target) {
    if (!confirmLeaveInspect()) return;
    if (target === 'home') { renderHome(); show('home'); }
    else if (target === 'dashboard') showDashboard();
    else if (target === 'log') showLog();
    else if (target === 'logout') logout();
  }

  function updateChrome() {
    var u = state.user;
    $('brand-name').textContent = ((state.cache && state.cache.config && state.cache.config.orgName) || D.appName || t('brand.default'));
    $('user-chip').hidden = !u;
    if (u) $('user-chip').innerHTML = ico(u.role === 'ADMIN' ? 'shield' : 'user') + '<span>' + esc(u.name) + '</span>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-admin]'), function (el) { el.hidden = !isAdmin(); });
    $('home-admin').hidden = !isAdmin();
  }

  /* ============================== Auth ============================== */

  function showLogin(message) {
    show('login');
    $('login-msg').textContent = message || '';
    $('login-pin').value = '';
    var sel = $('login-user');
    sel.innerHTML = '<option value="" data-i18n="login.userLoading">' + esc(t('login.userLoading')) + '</option>';
    call('listUsers').then(function (users) {
      var last = lsGet(LS.LAST_USER, '');
      sel.innerHTML = '<option value="" data-i18n="login.userPick">' + esc(t('login.userPick')) + '</option>' + users.map(function (u) {
        return '<option value="' + esc(u.id) + '"' + (u.id === last ? ' selected' : '') + '>' + esc(u.name) + '</option>';
      }).join('');
      if (!users.length) $('login-msg').textContent = t('login.noUsers');
    }).catch(function (e) {
      sel.innerHTML = '<option value="" data-i18n="login.userFail">' + esc(t('login.userFail')) + '</option>';
      $('login-msg').textContent = e.code === 'NETWORK' ? t('login.needNet') : e.message;
    });
  }

  function doLogin() {
    var userId = $('login-user').value;
    var pin = $('login-pin').value.trim();
    if (!userId) { $('login-msg').textContent = t('login.needUser'); return; }
    if (!/^\d{4,6}$/.test(pin)) { $('login-msg').textContent = t('login.pinFormat'); return; }
    var btn = $('login-btn');
    btn.disabled = true;
    btn.textContent = t('login.checking');
    call('login', { userId: userId, pin: pin }).then(function (res) {
      state.token = res.token;
      state.user = res.user;
      lsSet(LS.TOKEN, res.token);
      lsSet(LS.EXP, res.exp);
      lsSet(LS.USER, res.user);
      lsSet(LS.LAST_USER, res.user.id);
      if (state.cache && state.cache.me && state.cache.me.id !== res.user.id) { state.cache = null; lsDel(LS.CACHE); }
      afterLogin();
    }).catch(function (e) {
      $('login-msg').textContent = e.message;
      $('login-pin').value = '';
      $('login-pin').setAttribute('aria-invalid', 'true');
      $('login-pin').focus();
    }).then(function () {
      btn.disabled = false;
      btn.textContent = t('login.btn');
    });
  }

  function afterLogin() {
    updateChrome();
    renderHome();
    var id = state.initialId;
    var view = state.initialView;
    state.initialId = '';
    state.initialView = '';
    if (id) openEquipment(id, 'QR');
    else if (view === 'print' && isAdmin()) showPrint();
    else show('home');
    refreshBootstrap();
    flushQueue();
  }

  function refreshBootstrap() {
    return call('bootstrap').then(function (d) {
      d.fetchedAt = Date.now();
      state.cache = d;
      state.user = d.me;
      if (!lsSet(LS.CACHE, d)) console.warn('บันทึกข้อมูลออฟไลน์ไม่ได้ (พื้นที่เต็ม)');
      lsSet(LS.USER, d.me);
      updateChrome();
      if (state.view === 'home') renderHome();
    }).catch(function (e) {
      if (e.code !== 'NETWORK' && e.code !== 'AUTH') toast(e.message);
    });
  }

  function handleAuthExpired() {
    if (!state.token) return;
    state.token = null;
    lsDel(LS.TOKEN);
    lsDel(LS.EXP);
    showLogin(t('auth.expired'));
  }

  function logout() {
    var q = queueFor(state.user && state.user.id);
    var msg = q.length ? t('logout.confirmQueue', { n: q.length }) : t('logout.confirm');
    if (!window.confirm(msg)) return;
    state.token = null;
    state.user = null;
    state.cache = null;
    state.dash = null;
    lsDel(LS.TOKEN); lsDel(LS.EXP); lsDel(LS.USER); lsDel(LS.CACHE);
    updateChrome();
    showLogin();
  }

  /* ============================== Home ============================== */

  function renderHome() {
    var u = state.user;
    $('home-greet').textContent = u ? t('home.greet', { name: u.name }) : '';
    var box = $('home-progress');
    var c = state.cache;
    if (!c || !c.equipment) {
      box.innerHTML = '<div class="skel" style="margin:0;height:52px"></div>';
    } else {
      var items = c.equipment;
      var done = items.filter(function (i) { return i.inspectedThisMonth; }).length;
      var dmg = items.filter(function (i) { return i.status === 'DAMAGED'; }).length;
      var exp = items.filter(function (i) { return i.expiry !== 'OK'; }).length;
      var pct = items.length ? Math.round(done / items.length * 100) : 0;
      box.innerHTML =
        '<div style="display:flex;justify-content:space-between"><b>' + t('home.doneMonth') + '</b><span>' + t('home.tanks', { done: done, total: items.length }) + '</span></div>' +
        '<div class="progress"><div style="width:' + pct + '%"></div></div>' +
        '<div class="chips">' + (dmg ? '<span class="chip DAMAGED">' + ico('alert') + esc(t('home.dmg', { n: dmg })) + '</span>' : '') +
        (exp ? '<span class="chip SOON">' + ico('hourglass') + esc(t('home.exp', { n: exp })) + '</span>' : '') + '</div>' +
        '<div class="muted small" style="margin-top:6px">' + esc(t('home.asOf', { t: fmtDateTime(c.generatedAt) })) + '</div>';
    }
    renderFailed();
    renderQueueBanner();
  }

  function goManual() {
    var raw = $('manual-id').value.trim().toUpperCase();
    if (!ID_RE.test(raw)) { toast(t('manual.invalid')); return; }
    $('manual-id').value = '';
    openEquipment(raw, 'MANUAL');
  }

  /* ============================== Scanner ============================== */

  function parseScannedId(text) {
    text = String(text || '').trim();
    var id = text;
    var m = text.match(/[?&]id=([^&#]+)/i);
    if (m) {
      try { id = decodeURIComponent(m[1]); } catch (e) { id = m[1]; }
    } else if (/^https?:\/\//i.test(text)) {
      return '';
    }
    id = id.trim().toUpperCase();
    return ID_RE.test(id) ? id : '';
  }

  function setScanMsg(key) { state.scanKey = key; $('scan-msg').innerHTML = t(key); }

  /* แสดงสาเหตุทางเทคนิคใต้กรอบกล้อง (ชื่อ error) และปุ่มลองใหม่ เพื่อให้ผู้ใช้แจ้งผู้ดูแลได้ */
  function setScanProblem(detail) {
    var d = $('scan-detail');
    d.textContent = detail || '';
    d.hidden = !detail;
    $('scan-retry').hidden = false;
    showLiveLink();
  }
  function clearScanProblem() { $('scan-detail').hidden = true; $('scan-retry').hidden = true; $('scan-live').hidden = true; clearTimeout(state.scanWatch); }
  /* ตัวสแกนกล้องสดแยกหน้า (นอกกรอบ iframe ของ Google) — แสดงเมื่อกล้องในหน้านี้เปิดไม่ได้และตั้งค่า SCANNER_URL แล้ว */
  function showLiveLink() {
    var a = $('scan-live');
    if (!D.scannerUrl || !/^https:\/\//.test(D.scannerUrl)) { a.hidden = true; return; }
    var sep = D.scannerUrl.indexOf('?') === -1 ? '?' : '&';
    a.href = D.scannerUrl + sep + 'app=' + encodeURIComponent(D.baseUrl || '') + '&lang=' + I.getLang();
    a.hidden = false;
  }
  function errText(err) { return String(err && (err.name ? err.name + (err.message ? ': ' + err.message : '') : err.message || err) || '').slice(0, 140); }

  /* เมื่อกล้องถูกปฏิเสธ แยกสาเหตุ: แอปแชท / ผู้ใช้ปิดสิทธิ์ไว้ / ถูกบล็อกโดยบริบทของหน้า (เช่น iframe ของ Apps Script) */
  function diagnoseDenied() {
    var inApp = /Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Messenger|Zalo|KAKAOTALK/i.test(navigator.userAgent || '');
    var framed = false;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    var base = (inApp ? 'inapp' : 'browser') + (framed ? ',iframe' : '');
    if (inApp) return Promise.resolve({ key: 'scan.inapp', info: base });
    // กรอบ iframe ที่เจ้าของหน้า (Google) ไม่ได้เปิดสิทธิ์กล้องให้ → ต่อให้เปิดสิทธิ์ในมือถือแล้วก็ใช้กล้องสดไม่ได้
    var pp = document.permissionsPolicy || document.featurePolicy, policyBlocked = false;
    try { policyBlocked = !!pp && typeof pp.allowsFeature === 'function' && !pp.allowsFeature('camera'); } catch (e) { policyBlocked = false; }
    if (policyBlocked) return Promise.resolve({ key: 'scan.policyBlocked', info: base + ',policy=blocked' });
    var q;
    try { q = navigator.permissions && navigator.permissions.query ? navigator.permissions.query({ name: 'camera' }) : null; } catch (e) { q = null; }
    if (!q) return Promise.resolve({ key: 'scan.blockedCtx', info: base + ',perm=n/a' });
    return q.then(function (p) {
      return { key: p.state === 'denied' ? 'scan.permDenied' : 'scan.blockedCtx', info: base + ',perm=' + p.state };
    }, function () { return { key: 'scan.blockedCtx', info: base + ',perm=n/a' }; });
  }
  function cameraPolicyBlocked() {
    var pp = document.permissionsPolicy || document.featurePolicy;
    try { return !!pp && typeof pp.allowsFeature === 'function' && !pp.allowsFeature('camera'); } catch (e) { return false; }
  }
  /* เมื่อกล้องสดใช้ไม่ได้ ให้ปุ่มถ่ายรูปเป็นทางหลัก */
  function setPhotoPrimary(on) {
    var b = $('scan-photo-btn');
    if (b) b.className = 'btn file-btn ' + (on && $('scan-live').hidden ? 'btn-primary' : 'btn-outline');
  }

  var SCAN_CFG = { fps: 10, qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } };

  /* เริ่มกล้อง: ลองกล้องหลังก่อน ถ้าไม่ได้ (ไม่ใช่เพราะไม่อนุญาต) ลองเลือกกล้องจากรายการอุปกรณ์ */
  function startCamera(scanner) {
    var noop = function () { /* ยังไม่เจอ QR ในเฟรมนี้ */ };
    return scanner.start({ facingMode: 'environment' }, SCAN_CFG, onScanSuccess, noop).catch(function (err) {
      if (/Permission|NotAllowed|Security/i.test(errText(err))) throw err;
      return Html5Qrcode.getCameras().then(function (cams) {
        if (!cams || !cams.length) throw err;
        var back = cams.filter(function (c) { return /back|rear|environment|หลัง/i.test(c.label || ''); })[0];
        return scanner.start((back || cams[cams.length - 1]).id, SCAN_CFG, onScanSuccess, noop);
      });
    });
  }

  function startScan() {
    show('scan');
    state.scanLocked = false;
    clearScanProblem();
    setPhotoPrimary(false);
    if (typeof Html5Qrcode === 'undefined') {
      setScanMsg('scan.libFail');
      setScanProblem('html5-qrcode not loaded');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setScanMsg('scan.noCam');
      setScanProblem('mediaDevices unavailable (' + (window.isSecureContext ? 'secure' : 'not secure') + ' context)');
      return;
    }
    // กรอบ iframe ของ Google ไม่เปิดสิทธิ์กล้อง → ลองเปิดไปก็ไม่มีวันได้ ข้ามไปแสดงปุ่มตัวสแกนกล้องสด (นอกกรอบ) เป็นทางหลักทันที
    if (cameraPolicyBlocked() && D.scannerUrl) {
      stopScanner();
      setScanMsg('scan.useLive');
      showLiveLink();
      $('scan-live').hidden = false;
      setPhotoPrimary(true);
      return;
    }
    setScanMsg('scan.opening');
    var token = (state.scanToken = (state.scanToken || 0) + 1);
    // กล้องเดิมที่ยังค้างอยู่ต้องปิดก่อน ไม่งั้นกล้องใหม่จะเปิดไม่ติด (จอดำ)
    stopScanner().then(function () {
      if (token !== state.scanToken || state.view !== 'scan') return;
      try {
        var scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
        state.scanner = scanner;
        // 7 วินาทีแล้วภาพยังไม่ขึ้น (วิดีโอไม่มีความกว้าง) → แสดงคำแนะนำและปุ่มลองใหม่
        state.scanWatch = setTimeout(function () {
          var v = document.querySelector('#reader video');
          if (token === state.scanToken && state.view === 'scan' && !state.scanLocked && (!v || !v.videoWidth)) {
            setScanMsg('scan.slow');
            setScanProblem('no video frames after 7s');
          }
        }, 7000);
        startCamera(scanner).then(function () {
          if (token !== state.scanToken) return;
          if (state.view !== 'scan') { stopScanner(); return; }
          clearScanProblem();
          setScanMsg('scan.aim');
        }).catch(function (err) {
          if (token !== state.scanToken) return;
          state.scanner = null;
          clearTimeout(state.scanWatch);
          var denied = /Permission|NotAllowed|Security/i.test(errText(err));
          if (!denied) {
            setScanMsg('scan.failFull');
            setScanProblem(errText(err));
            setPhotoPrimary(true);
            return;
          }
          diagnoseDenied().then(function (d) {
            if (token !== state.scanToken) return;
            setScanMsg(d.key);
            setScanProblem(errText(err) + ' [' + d.info + ']');
            // ถ้าถูกบล็อกที่ระดับหน้า การลองใหม่ไม่ช่วย → ซ่อนปุ่มลองใหม่ เหลือแต่ปุ่มถ่ายรูป
            if (d.key === 'scan.policyBlocked') $('scan-retry').hidden = true;
            setPhotoPrimary(true);
          });
        });
      } catch (err) {
        state.scanner = null;
        setScanMsg('scan.failShort');
        setScanProblem(errText(err));
      }
    });
  }

  function stopScanner() {
    var s = state.scanner;
    state.scanner = null;
    if (!s) return Promise.resolve();
    var p;
    try { p = s.isScanning ? s.stop() : Promise.resolve(); } catch (e) { p = Promise.resolve(); }
    return p.then(function () { try { s.clear(); } catch (e) { /* ignore */ } }).catch(function () { /* ignore */ });
  }

  function onScanSuccess(text) {
    if (state.scanLocked) return;
    var id = parseScannedId(text);
    if (!id) { toast(t('scan.notOurs')); return; }
    state.scanLocked = true;
    if (navigator.vibrate) navigator.vibrate(80);
    stopScanner().then(function () { openEquipment(id, 'QR'); });
  }

  function onScanFile(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (typeof Html5Qrcode === 'undefined') { toast(t('scan.readLibFail')); return; }
    loading(true, t('scan.readingImg'));
    stopScanner().then(function () {
      return imageToCanvas(file, 1400);
    }).then(function (canvas) {
      return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.92); });
    }).then(function (blob) {
      var reader = new Html5Qrcode('reader-file', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
      var f = new File([blob], 'qr.jpg', { type: 'image/jpeg' });
      return reader.scanFile(f, false).then(function (text) {
        try { reader.clear(); } catch (x) { /* ignore */ }
        return text;
      });
    }).then(function (text) {
      loading(false);
      var id = parseScannedId(text);
      if (!id) { toast(t('scan.notOurs')); startScan(); return; }
      openEquipment(id, 'QR');
    }).catch(function () {
      loading(false);
      toast(t('scan.imgFail'), 4000);
      startScan();
    });
  }

  /* ============================== Images ============================== */

  function imageToCanvas(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error(t('img.readFail'))); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error(t('img.readFail'))); };
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * scale));
          c.height = Math.max(1, Math.round(h * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  var PHOTO_MAX_CHARS = 1200000;
  function compressPhoto(file) {
    return imageToCanvas(file, 1280).then(function (c) {
      // เป้า ≤ ~1.2 ล้านตัวอักษร เพื่อให้คิวออฟไลน์ใน localStorage (โควตาราว 5 ล้านตัวอักษร) เก็บได้หลายรายการ
      var q = 0.72;
      var url = c.toDataURL('image/jpeg', q);
      while (url.length > PHOTO_MAX_CHARS && q > 0.3) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
      return url;
    });
  }

  /* ============================== Inspection ============================== */

  function applicableChecklist(checklist, type) {
    return (checklist || []).filter(function (q) { return !q.appliesTo.length || q.appliesTo.indexOf(type) !== -1; });
  }

  function findCached(id) {
    var c = state.cache;
    if (!c || !c.equipment) return null;
    return c.equipment.filter(function (x) { return x.id === id; })[0] || null;
  }

  function openEquipment(id, method) {
    loading(true, t('insp.loadingTank', { id: id }));
    call('getEquipment', { id: id }).then(function (d) {
      startInspect(d.item, d.checklist, method, false);
    }).catch(function (err) {
      if (err.code === 'NETWORK') {
        var item = findCached(id);
        if (item) { startInspect(item, applicableChecklist(state.cache.checklist, item.type), method, true); return; }
        toast(t('insp.offlineNotFound', { id: id }), 4500);
      } else if (err.code !== 'AUTH') {
        toast(err.message, 4500);
      }
      if (state.token) { renderHome(); show('home'); }
    }).then(function () { loading(false); });
  }

  function startInspect(item, checklist, method, fromCache) {
    if (!checklist.length) { toast(t('insp.noList')); return; }
    state.current = { item: item, checklist: checklist, method: method, answers: {}, photo: null, repaired: false, remarks: '', fromCache: fromCache };
    renderInspect();
    show('inspect');
  }

  function renderInspect() {
    var c = state.current;
    var it = c.item;
    var h = '<div class="insp-sticky"><div class="row"><span id="insp-count"></span><span class="muted">' + esc(it.id) + '</span></div><div class="progress"><div id="insp-bar" style="width:0"></div></div></div>' +
      '<div class="card">' +
      '<div class="tank-id">' + esc(it.id) + '</div>' +
      '<div class="tank-loc">' + esc(locText(it)) + '</div>' +
      '<div class="muted small">' + esc([I.typeName(it.type), it.size ? t('insp.lb', { size: it.size }) : '', it.brand].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="chips">' + statusChip(it.status) + expiryChip(it) +
      (c.method === 'MANUAL' ? '<span class="chip MANUAL">' + ico('keyboard') + esc(t('insp.manualChip')) + '</span>' : '') + '</div>' +
      expiryDetailsHtml(it) + '</div>';
    if (c.fromCache) h += '<div class="notice info">' + ico('wifioff') + '<div>' + esc(t('insp.offlineNote')) + '</div></div>';
    if (it.inspectedThisMonth && it.last) {
      h += '<div class="notice warn">' + ico('alert') + '<div>' + t('insp.doneThisMonth', { t: esc(fmtDateTime(it.last.time)), by: esc(it.last.by), res: it.last.result === 'FAIL' ? t('res.fail') : t('res.pass') }) + '</div></div>';
    }
    if (it.status === 'DAMAGED' && it.last && it.last.failedItems) {
      h += '<div class="notice warn">' + ico('wrench') + '<div>' + esc(t('insp.prevFail', { items: I.failedItems(it.last.failedItems) })) + '</div></div>';
    }
    h += '<h3>' + esc(t('insp.listTitle', { n: c.checklist.length })) + '</h3><div class="check-list">';
    c.checklist.forEach(function (q, i) {
      h += '<div class="check-item" data-q="' + esc(q.id) + '">' +
        '<div class="check-title">' + (i + 1) + '. ' + esc(I.checkTitle(q.title)) + '</div>' +
        (q.how ? '<div class="check-how">' + esc(I.checkHow(q.how)) + '</div>' : '<div style="height:8px"></div>') +
        '<div class="pf" role="group" aria-label="' + esc(I.checkTitle(q.title)) + '"><button type="button" data-ans="PASS" aria-pressed="false">' + ico('check') + esc(t('res.pass')) + '</button>' +
        '<button type="button" data-ans="FAIL" aria-pressed="false">' + ico('x') + esc(t('res.fail')) + '</button></div></div>';
    });
    h += '</div>';
    if (it.status === 'DAMAGED') {
      h += '<div class="card" style="margin-top:12px"><label class="toggle"><input type="checkbox" id="insp-repaired"><span>' + esc(t('insp.repaired')) + '</span></label></div>';
    }
    h += '<div class="card" id="photo-box" style="margin-top:12px" hidden>' +
      '<b>' + ico('camera') + ' ' + esc(t('insp.photoTitle')) + '</b>' +
      '<label class="btn btn-outline file-btn" style="margin-top:8px" id="photo-label"><span id="photo-label-text">' + esc(t('insp.photoBtn')) + '</span><input type="file" accept="image/*" capture="environment" id="photo-input"></label>' +
      '<img id="photo-preview" class="photo-preview" alt="' + esc(t('insp.photoAlt')) + '" hidden></div>';
    h += '<label class="field" for="insp-remarks">' + esc(t('insp.remarks')) + '</label>' +
      '<textarea id="insp-remarks" maxlength="500" placeholder="' + esc(t('insp.remarksPh')) + '"></textarea>';
    h += '<div class="sticky-submit"><button class="btn btn-primary" id="insp-submit" type="button" disabled></button></div>' +
      '<button class="btn btn-ghost" id="insp-cancel" type="button" style="margin-top:8px">' + esc(t('common.cancel')) + '</button>';
    $('view-inspect').innerHTML = h;
    updateInspectState();
  }

  function anyFail() {
    var a = state.current.answers;
    return Object.keys(a).some(function (k) { return a[k] === 'FAIL'; });
  }

  function updateInspectState() {
    var c = state.current;
    var total = c.checklist.length;
    var answered = Object.keys(c.answers).length;
    var fail = anyFail();
    $('insp-count').textContent = t('insp.count', { a: answered, n: total });
    $('insp-bar').style.width = Math.round(answered / total * 100) + '%';
    Array.prototype.forEach.call(document.querySelectorAll('#view-inspect .check-item'), function (el) {
      var v = c.answers[el.getAttribute('data-q')];
      el.classList.toggle('pass', v === 'PASS');
      el.classList.toggle('fail', v === 'FAIL');
      var bp = el.querySelector('[data-ans=PASS]');
      var bf = el.querySelector('[data-ans=FAIL]');
      bp.className = v === 'PASS' ? 'sel-pass' : '';
      bf.className = v === 'FAIL' ? 'sel-fail' : '';
      bp.setAttribute('aria-pressed', String(v === 'PASS'));
      bf.setAttribute('aria-pressed', String(v === 'FAIL'));
    });
    $('photo-box').hidden = !fail;
    var btn = $('insp-submit');
    if (answered < total) { btn.disabled = true; btn.textContent = t('insp.count', { a: answered, n: total }); }
    else if (fail && !c.photo) { btn.disabled = true; btn.textContent = t('insp.needPhoto'); }
    else { btn.disabled = false; btn.innerHTML = ico('save') + esc(fail ? t('insp.saveFail') : t('insp.savePass')); }
  }

  function onInspectClick(e) {
    var ans = e.target.closest('[data-ans]');
    if (ans) {
      var item = ans.closest('.check-item');
      state.current.answers[item.getAttribute('data-q')] = ans.getAttribute('data-ans');
      if (navigator.vibrate) navigator.vibrate(12);
      var nextEl = item.nextElementSibling;
      while (nextEl && !(nextEl.classList.contains('check-item') && !state.current.answers[nextEl.getAttribute('data-q')])) nextEl = nextEl.nextElementSibling;
      if (nextEl && ans.getAttribute('data-ans') === 'PASS') setTimeout(function () { nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 180);
      updateInspectState();
      return;
    }
    if (e.target.closest('#insp-submit')) { submitInspection(); return; }
    if (e.target.closest('#insp-cancel')) { onNav('home'); }
  }

  function onInspectChange(e) {
    var c = state.current;
    if (!c) return;
    if (e.target.id === 'insp-repaired') c.repaired = e.target.checked;
    if (e.target.id === 'photo-input') {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      loading(true, t('insp.resizing'));
      compressPhoto(file).then(function (dataUrl) {
        c.photo = dataUrl;
        var img = $('photo-preview');
        img.src = dataUrl;
        img.hidden = false;
        $('photo-label-text').textContent = t('insp.photoRetake');
        updateInspectState();
      }).catch(function (err) { toast(err.message); }).then(function () { loading(false); });
    }
  }

  function submitInspection() {
    var c = state.current;
    if (!c) return;
    var fail = anyFail();
    if (Object.keys(c.answers).length < c.checklist.length) { toast(t('insp.answerAll')); return; }
    if (fail && !c.photo) { toast(t('insp.photoToast')); return; }
    var payload = {
      uuid: uuid(),
      equipmentId: c.item.id,
      method: c.method,
      answers: c.answers,
      remarks: ($('insp-remarks').value || '').trim().slice(0, 500),
      repaired: !!c.repaired,
      photo: fail ? c.photo : null,
      clientTime: new Date().toISOString(),
    };
    var btn = $('insp-submit');
    btn.disabled = true;
    btn.textContent = t('insp.saving');
    call('submitInspection', payload).then(function (res) {
      applyLocalResult(c.item.id, payload, res.status);
      renderDone(c.item, res.status, false, res.alert);
    }).catch(function (err) {
      if (err.code === 'NETWORK' || err.code === 'AUTH' || err.code === 'BUSY') {
        if (!enqueue(payload)) {
          toast(t('insp.storageFull'), 5000);
          updateInspectState();
          return;
        }
        applyLocalResult(c.item.id, payload, fail ? 'DAMAGED' : 'NORMAL');
        if (err.code === 'AUTH') { toast(t('insp.savedLocalLogin'), 5000); return; }
        renderDone(c.item, fail ? 'DAMAGED' : 'NORMAL', true);
      } else {
        toast(err.message, 5000);
        updateInspectState();
      }
    });
  }

  function applyLocalResult(id, payload, status) {
    var it = findCached(id);
    if (!it) return;
    var fail = Object.keys(payload.answers).some(function (k) { return payload.answers[k] === 'FAIL'; });
    it.status = status;
    it.inspectedThisMonth = true;
    it.monthCount = (it.monthCount || 0) + 1;
    it.last = { time: payload.clientTime, by: state.user.name, result: fail ? 'FAIL' : 'PASS', method: payload.method, repaired: payload.repaired, failedItems: '' };
    lsSet(LS.CACHE, state.cache);
  }

  function renderDone(item, status, queued, alertState) {
    state.current = null;
    state.doneArgs = [item, status, queued, alertState];
    paintDone();
    show('done');
    renderQueueBanner();
  }

  function paintDone() {
    var a = state.doneArgs;
    if (!a) return;
    var item = a[0], status = a[1], queued = a[2], alertState = a[3];
    var ok = status !== 'DAMAGED';
    // ถ้าอีเมลยังไม่ได้ส่ง ต้องบอกผู้ตรวจตรง ๆ ให้แจ้งผู้รับผิดชอบเอง ไม่ใช่บอกว่าส่งแล้ว
    var alertNote = alertState === 'PENDING' ? 'done.alertPending' : (alertState === 'NO_RECIPIENTS' ? 'done.alertNone' : 'done.emailed');    $('view-done').innerHTML =
      '<div class="done-icon ' + (queued ? 'q' : (ok ? 'ok' : 'bad')) + '">' + ico(queued ? 'upload' : (ok ? 'check' : 'alert')) + '</div>' +
      '<h2 class="center">' + esc(queued ? t('done.queued') : t('done.saved')) + '</h2>' +
      '<p class="center"><b>' + esc(item.id) + '</b><br><span class="muted">' + esc(locText(item)) + '</span></p>' +
      '<p class="center">' + statusChip(status) + '</p>' +
      (queued ? '<div class="notice info">' + esc(t('done.queuedNote')) + '</div>' : '') +
      (!ok && !queued ? '<div class="notice warn">' + esc(t(alertNote)) + '</div>' : '') +
      '<div class="stack" style="margin-top:18px">' +
      '<button class="btn btn-primary btn-big" type="button" id="done-next">' + ico('scan') + esc(t('done.next')) + '</button>' +
      '<button class="btn btn-outline" type="button" id="done-home">' + esc(t('done.home')) + '</button></div>';
  }

  /* ============================== Offline queue ============================== */

  function enqueue(payload) {
    var q = lsGet(LS.QUEUE, []);
    q.push({ payload: payload, userId: state.user.id, queuedAt: Date.now() });
    var ok = lsSet(LS.QUEUE, q);
    renderQueueBanner();
    return ok;
  }

  function queueFor(userId) {
    return lsGet(LS.QUEUE, []).filter(function (x) { return x.userId === userId; });
  }

  var MAX_QUEUE_TRIES = 5;
  function bumpTries(id) {
    var n = 0;
    var q = lsGet(LS.QUEUE, []);
    q.forEach(function (x) { if (x.payload.uuid === id) { x.tries = (x.tries || 0) + 1; n = x.tries; } });
    lsSet(LS.QUEUE, q);
    return n;
  }

  function removeFromQueue(id) {
    lsSet(LS.QUEUE, lsGet(LS.QUEUE, []).filter(function (x) { return x.payload.uuid !== id; }));
  }

  function flushQueue() {
    if (state.flushing || !state.token || !state.user) return Promise.resolve();
    var mine = queueFor(state.user.id);
    if (!mine.length) { renderQueueBanner(); return Promise.resolve(); }
    state.flushing = true;
    var sent = 0;
    var i = 0;
    function next() {
      if (i >= mine.length) return Promise.resolve();
      var entry = mine[i++];
      return call('submitInspection', entry.payload).then(function () {
        removeFromQueue(entry.payload.uuid);
        sent++;
        return next();
      }).catch(function (err) {
        if (err.code === 'NETWORK' || err.code === 'AUTH' || err.code === 'BUSY') return; // ลองใหม่รอบหน้า
        // ข้อผิดพลาดภายใน server (ERROR) ลองซ้ำได้จำกัด ไม่งั้นรายการที่ติดปัญหาถาวรจะยิง server ทุก 30 วินาทีตลอดไป
        if (err.code === 'ERROR' && bumpTries(entry.payload.uuid) < MAX_QUEUE_TRIES) return;
        // ข้อมูลไม่ผ่านการตรวจสอบของ server หรือลองครบจำนวนแล้ว → ย้ายไปรายการที่ส่งไม่สำเร็จ
        removeFromQueue(entry.payload.uuid);
        var failed = lsGet(LS.FAILED, []);
        failed.push({ equipmentId: entry.payload.equipmentId, time: entry.payload.clientTime, error: err.raw || err.message });
        lsSet(LS.FAILED, failed.slice(-20));
        return next();
      });
    }
    return next().then(function () {
      state.flushing = false;
      renderQueueBanner();
      if (state.view === 'home') renderFailed();
      if (sent) { toast(t('queue.sent', { n: sent })); refreshBootstrap(); }
    });
  }

  function renderQueueBanner() {
    var n = state.user ? queueFor(state.user.id).length : 0;
    var b = $('queue-banner');
    b.hidden = !n;
    if (n) b.innerHTML = ico('upload') + '<div>' + t('queue.waiting', { n: n }) + '</div><button type="button" class="btn btn-outline btn-sm" id="queue-send">' + esc(t('queue.sendNow')) + '</button>';
  }

  function renderFailed() {
    var failed = lsGet(LS.FAILED, []);
    var box = $('home-failed');
    if (!failed.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="card card-alert"><b>' + ico('alert') + ' ' + esc(t('failed.title', { n: failed.length })) + '</b>' +
      '<div class="small" style="margin-top:6px">' + failed.map(function (f) {
        return esc(f.equipmentId) + ' (' + esc(fmtDateTime(f.time)) + '): ' + esc(I.srv(f.error));
      }).join('<br>') + '</div><p class="muted small">' + esc(t('failed.redo')) + '</p>' +
      '<button class="btn btn-outline" type="button" id="failed-clear">' + esc(t('failed.clear')) + '</button></div>';
  }

  /* ============================== Dashboard ============================== */

  function listLabel(key) {
    if (key === 'problem') return t('list.problem');
    if (key === 'all') return t('list.all');
    return statusText(key) !== key ? statusText(key) : (expiryText(key) || key);
  }

  function showDashboard() {
    show('dashboard');
    if (!state.dash) $('dash-list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    if (state.dash) renderDashboard();
    loadDashboard();
  }

  /* force = true เมื่อผู้ใช้กดปุ่มรีเฟรช: ข้าม cache ของ server และแสดงสถานะกำลังโหลด */
  function loadDashboard(force) {
    force = force === true;
    var btn = $('dash-refresh');
    if (force) {
      if (btn.disabled) return Promise.resolve();
      btn.disabled = true;
      $('dash-updated').textContent = t('common.loading');
    } else if (!state.dash) {
      $('dash-updated').textContent = t('common.loading');
    }
    var failed = false;
    return call('getDashboard', { refresh: force }).then(function (d) {
      state.dash = d;
      if (state.view === 'dashboard') renderDashboard();
    }).catch(function (err) {
      if (err.code === 'NETWORK' && state.cache && state.cache.equipment) {
        state.dash = { items: state.cache.equipment, generatedAt: state.cache.generatedAt, offline: true };
        if (state.view === 'dashboard') renderDashboard();
      } else {
        failed = true;
        if (err.code !== 'AUTH') toast(err.message);
      }
    }).then(function () {
      btn.disabled = false;
      // รีเฟรชไม่สำเร็จ: คืนข้อความ "อัปเดตล่าสุด" เดิม แทนที่จะค้างที่ "กำลังโหลด"
      if (failed && state.dash && state.view === 'dashboard') renderDashboard();
    });
  }

  function matchesList(it, key) {
    if (key === 'all') return true;
    if (key === 'problem') return it.status === 'DAMAGED' || it.expiry !== 'OK';
    if (key === 'EXPIRED' || key === 'SOON') return it.expiry === key;
    return it.status === key;
  }

  function urgencyRank(it) {
    if (it.status === 'DAMAGED' && it.expiry === 'EXPIRED') return 0;
    if (it.status === 'DAMAGED') return 1;
    if (it.expiry === 'EXPIRED') return 2;
    if (it.expiry === 'SOON') return 3;
    if (it.status === 'PENDING') return 4;
    return 5;
  }

  function renderDashboard() {
    var d = state.dash;
    var f = state.dashFilter;
    var all = d.items || [];
    $('dash-updated').textContent = t(d.offline ? 'dash.updatedOffline' : 'dash.updatedOnline', { t: fmtDateTime(d.generatedAt) });

    var buildings = all.map(function (i) { return i.building; }).filter(function (b, i, a) { return b && a.indexOf(b) === i; }).sort(naturalCmp);
    if (f.building && buildings.indexOf(f.building) === -1) f.building = '';
    $('f-building').innerHTML = '<option value="">' + esc(t('dash.allBuildings')) + '</option>' + buildings.map(function (b) {
      return '<option value="' + esc(b) + '"' + (b === f.building ? ' selected' : '') + '>' + esc(b) + '</option>';
    }).join('');
    var floors = all.filter(function (i) { return !f.building || i.building === f.building; })
      .map(function (i) { return i.floor; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }).sort(naturalCmp);
    if (f.floor && floors.indexOf(f.floor) === -1) f.floor = '';
    $('f-floor').innerHTML = '<option value="">' + esc(t('dash.allFloors')) + '</option>' + floors.map(function (x) {
      return '<option value="' + esc(x) + '"' + (x === f.floor ? ' selected' : '') + '>' + esc(t('floor', { f: x })) + '</option>';
    }).join('');

    var items = all.filter(function (i) { return (!f.building || i.building === f.building) && (!f.floor || i.floor === f.floor); });
    var s = { total: items.length, NORMAL: 0, DAMAGED: 0, PENDING: 0, EXPIRED: 0, SOON: 0, done: 0 };
    items.forEach(function (i) {
      s[i.status]++;
      if (i.expiry === 'EXPIRED' || i.expiry === 'SOON') s[i.expiry]++;
      if (i.inspectedThisMonth) s.done++;
    });
    var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    $('dash-progress-text').innerHTML = t('dash.progressText', { done: s.done, total: s.total, pct: pct });
    $('dash-progress-bar').style.width = pct + '%';

    var cards = [['all', t('stat.all'), s.total, ''], ['NORMAL', statusText('NORMAL'), s.NORMAL, 's-normal'], ['DAMAGED', statusText('DAMAGED'), s.DAMAGED, 's-damaged'],
      ['PENDING', statusText('PENDING'), s.PENDING, 's-pending'], ['EXPIRED', expiryText('EXPIRED'), s.EXPIRED, 's-expired'], ['SOON', expiryText('SOON'), s.SOON, 's-soon']];
    $('dash-stats').innerHTML = cards.map(function (c) {
      return '<button type="button" class="stat ' + c[3] + (f.list === c[0] ? ' active' : '') + '" aria-pressed="' + (f.list === c[0]) + '" data-list="' + c[0] + '">' +
        ico(STATUS_ICON[c[0]] || EXPIRY_ICON[c[0]] || 'ext') + '<div class="card-num">' + c[2] + '</div><div class="lbl">' + esc(c[1]) + '</div></button>';
    }).join('');

    var problemCount = items.filter(function (i) { return matchesList(i, 'problem'); }).length;
    var tabs = [['problem', t('tab.problem', { n: problemCount })], ['PENDING', t('tab.pending', { n: s.PENDING })], ['all', t('tab.all', { n: s.total })]];
    var tabHtml = tabs.map(function (tb) {
      return '<button type="button" aria-pressed="' + (f.list === tb[0]) + '" data-list="' + tb[0] + '" class="' + (f.list === tb[0] ? 'active' : '') + '">' + esc(tb[1]) + '</button>';
    }).join('');
    if (['problem', 'PENDING', 'all'].indexOf(f.list) === -1) {
      tabHtml = '<button type="button" aria-pressed="true" class="active" data-list="' + esc(f.list) + '">' + esc(listLabel(f.list)) + '</button>' + tabHtml;
    }
    $('dash-tabs').innerHTML = tabHtml;

    var list = items.filter(function (i) { return matchesList(i, f.list); }).sort(function (a, b) {
      return urgencyRank(a) - urgencyRank(b) ||
        ((a.minDaysLeft === null ? 99999 : a.minDaysLeft) - (b.minDaysLeft === null ? 99999 : b.minDaysLeft)) ||
        naturalCmp(a.id, b.id);
    });
    $('dash-list').innerHTML = list.length ? list.map(function (i) {
      return '<button type="button" class="list-item" data-hist="' + esc(i.id) + '"><div class="grow"><div class="t">' + esc(i.id) +
        '</div><div class="s">' + (i.last ? esc(locText(i)) + '<br>' + esc(t('dash.lastInspected', { t: fmtDateTime(i.last.time), by: i.last.by })) : esc(locText(i)) + '<br>' + esc(t('dash.never'))) +
        '</div></div><div class="side">' + statusChip(i.status) + expiryChip(i) + '</div></button>';
    }).join('') : '<div class="empty">' + ico('check') + esc(t('dash.emptyList')) + '</div>';

    var adminBox = $('dash-admin');
    adminBox.hidden = !(isAdmin() && d.inspectorStats);
    if (!adminBox.hidden) {
      $('dash-inspectors').innerHTML = d.inspectorStats.length ? '<table class="stats"><tr><th>' + esc(t('stats.inspector')) + '</th><th class="num">' + esc(t('stats.count')) + '</th><th class="num">' + esc(t('stats.tanks')) + '</th><th class="num">' + esc(t('stats.fail')) + '</th><th class="num">' + esc(t('stats.manual')) + '</th></tr>' +
        d.inspectorStats.map(function (x) {
          return '<tr><td>' + esc(x.name) + '</td><td class="num">' + x.count + '</td><td class="num">' + x.tanks + '</td><td class="num">' + x.fail +
            '</td><td class="num' + (x.manualPct > 20 ? ' hl' : '') + '">' + x.manual + ' (' + x.manualPct + '%)</td></tr>';
        }).join('') + '</table><p class="muted small">' + esc(t('stats.note')) + '</p>'
        : '<div class="empty">' + esc(t('stats.empty')) + '</div>';
    }
  }

  function inspectionRowHtml(r, showEquipment) {
    return '<div class="hist">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>' +
      (showEquipment ? esc(r.equipmentId) + ' · ' : '') + esc(fmtDateTime(r.time)) + '</b>' +
      '<span class="chip ' + (r.result === 'FAIL' ? 'DAMAGED' : 'NORMAL') + '">' + ico(r.result === 'FAIL' ? 'x' : 'check') + esc(r.result === 'FAIL' ? t('res.fail') : t('res.pass')) + '</span></div>' +
      (showEquipment && r.location ? '<div class="muted small">' + esc(I.locStr(r.location)) + '</div>' : '') +
      '<div class="small">' + esc(t('hist.by', { by: r.by })) + (r.method === 'MANUAL' ? ' <span class="chip MANUAL">MANUAL</span>' : '') +
      (r.repaired ? ' <span class="chip NORMAL">' + ico('wrench') + esc(t('hist.repaired')) + '</span>' : '') + '</div>' +
      (r.failedItems ? '<div class="small hl">' + esc(t('hist.failedItems', { items: I.failedItems(r.failedItems) })) + '</div>' : '') +
      (r.remarks ? '<div class="small">' + ico('note') + ' ' + esc(r.remarks) + '</div>' : '') +
      (r.photoId ? '<button type="button" class="btn btn-outline btn-sm" data-photo="' + esc(r.photoId) + '" style="margin-top:8px">' + ico('image') + esc(t('hist.view')) + '</button>' :
        (r.hasPhoto ? '<div class="muted small">' + ico('image') + ' ' + esc(t('hist.hasPhoto')) + '</div>' : '')) +
      '</div>';
  }

  function openHistory(id) {
    var it = (state.dash && state.dash.items || []).filter(function (x) { return x.id === id; })[0];
    var head = it ? '<div class="card"><div class="tank-loc">' + esc(locText(it)) + '</div><div class="muted small">' +
      esc([I.typeName(it.type), it.size ? t('insp.lb', { size: it.size }) : ''].filter(Boolean).join(' · ')) + '</div><div class="chips">' +
      statusChip(it.status) + expiryChip(it) + '</div>' + expiryDetailsHtml(it) + '</div>' : '';
    openModal(id, head + '<h3>' + esc(t('hist.title')) + '</h3><div id="hist-list" class="muted">' + esc(t('common.loading')) + '</div>');
    call('getHistory', { id: id }).then(function (rows) {
      var el = $('hist-list');
      if (!el) return;
      el.classList.remove('muted');
      el.innerHTML = rows.length ? rows.map(function (r) { return inspectionRowHtml(r, false); }).join('') : '<div class="empty">' + esc(t('hist.empty')) + '</div>';
    }).catch(function (err) {
      var el = $('hist-list');
      if (el) el.textContent = err.code === 'NETWORK' ? t('hist.needNet') : err.message;
    });
  }

  function openPhoto(photoId) {
    loading(true, t('photo.loading'));
    call('getPhoto', { photoId: photoId }).then(function (res) {
      openModal(t('photo.title'), '<img src="' + esc(res.dataUrl) + '" alt="' + esc(t('photo.title')) + '" style="width:100%;border-radius:12px">');
    }).catch(function (err) { toast(err.message); }).then(function () { loading(false); });
  }

  /* ============================== Admin log ============================== */

  function showLog() {
    if (!isAdmin()) return;
    show('log');
    if (!$('log-month').value) $('log-month').value = currentYm();
    loadLog();
  }

  function loadLog() {
    $('log-summary').textContent = t('common.loading');
    $('log-list').innerHTML = '';
    call('getInspectionLog', { ym: $('log-month').value }).then(function (d) {
      state.log = d;
      renderLog();
    }).catch(function (err) {
      $('log-summary').textContent = err.code === 'NETWORK' ? t('log.needNet') : err.message;
    });
  }

  function renderLog() {
    var d = state.log;
    if (!d) return;
    var q = $('log-search').value.trim().toLowerCase();
    var rows = d.rows.filter(function (r) {
      return !q || (r.equipmentId + ' ' + r.by + ' ' + r.location).toLowerCase().indexOf(q) !== -1;
    });
    var p = d.ym.split('-');
    $('log-summary').textContent = t('log.summary', { m: p[1] + '/' + buddhistYear(p[0]), total: d.total, n: d.total }) +
      (q ? t('log.match', { n: rows.length }) : '') + (d.total > d.rows.length ? t('log.showing', { n: d.rows.length }) : '');
    $('log-list').innerHTML = rows.length ? rows.map(function (r) { return inspectionRowHtml(r, true); }).join('') : '<div class="empty">' + esc(t('log.empty')) + '</div>';
  }

  /* ============================== Print QR ============================== */

  var qrLibPromise = null;
  function loadQrLib() {
    if (window.QRCode) return Promise.resolve();
    if (!qrLibPromise) {
      qrLibPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = QR_LIB;
        s.integrity = QR_LIB_SRI;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = function () { qrLibPromise = null; reject(new Error(t('print.libFail'))); };
        document.head.appendChild(s);
      });
    }
    return qrLibPromise;
  }

  function showPrint() {
    if (!isAdmin()) { toast(t('print.adminOnly')); return; }
    show('print');
    loadPrint();
  }

  function paintPrintInfo() {
    var w = $('print-warn');
    w.hidden = !state.printWarn;
    if (state.printWarn) w.textContent = t(state.printWarn);
    if (state.printCount !== null && state.printCount !== undefined) {
      $('print-info').textContent = t('print.info', { n: state.printCount, p: Math.ceil(state.printCount / 12) });
    }
  }

  function loadPrint() {
    state.printCount = null;
    state.printWarn = '';
    $('print-info').textContent = t('print.preparing');
    $('print-sheets').innerHTML = '';
    $('print-go').disabled = true;
    var building = $('print-building').value;
    Promise.all([loadQrLib(), call('getPrintData', { building: building })]).then(function (r) {
      var d = r[1];
      var sel = $('print-building');
      sel.innerHTML = '<option value="">' + esc(t('print.all')) + '</option>' + d.buildings.map(function (b) {
        return '<option value="' + esc(b) + '"' + (b === building ? ' selected' : '') + '>' + esc(b) + '</option>';
      }).join('');
      var base = d.baseUrl || D.baseUrl || '';
      if (!base) state.printWarn = 'print.noUrl';
      else if (/\/dev(\?|$)/.test(base)) state.printWarn = 'print.devUrl';
      renderLabels(d.items, base);
      state.printCount = d.items.length;
      paintPrintInfo();
      $('print-go').disabled = !d.items.length;
    }).catch(function (err) {
      $('print-info').textContent = err.message;
    });
  }

  function renderLabels(items, base) {
    var host = $('print-sheets');
    host.innerHTML = '';
    for (var p = 0; p < items.length; p += 12) {
      var sheet = document.createElement('div');
      sheet.className = 'label-sheet';
      items.slice(p, p + 12).forEach(function (it) {
        var el = document.createElement('div');
        el.className = 'qr-label';
        el.innerHTML = '<div class="ql-head">' + ico('ext') + ' ' + esc(t('print.labelHead')) + '</div><div class="ql-qr"></div>' +
          '<div class="ql-id">' + esc(it.id) + '</div><div class="ql-loc">' + esc(locText(it)) + '</div>' +
          '<div class="ql-hint">' + esc(t('print.labelHint')) + '</div>';
        new QRCode(el.querySelector('.ql-qr'), {
          text: (base || '') + '?id=' + encodeURIComponent(it.id),
          width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M,
        });
        sheet.appendChild(el);
      });
      host.appendChild(sheet);
    }
  }

  /* ============================== Language ============================== */

  /* สลับภาษาแล้ววาดหน้าปัจจุบันใหม่ โดยไม่เริ่มกล้องใหม่ และไม่ทำให้คำตอบที่กำลังกรอกหาย */
  function rerenderInspect() {
    var c = state.current;
    var y = window.pageYOffset;
    var rem = $('insp-remarks') ? $('insp-remarks').value : '';
    renderInspect();
    $('insp-remarks').value = rem;
    if ($('insp-repaired')) $('insp-repaired').checked = !!c.repaired;
    if (c.photo) {
      var img = $('photo-preview');
      img.src = c.photo;
      img.hidden = false;
      $('photo-label-text').textContent = t('insp.photoRetake');
    }
    window.scrollTo(0, y);
  }

  function setLang(l) {
    I.setLang(l);
    updateThemeButtons();
    updateChrome();
    var v = state.view;
    if (v === 'login') { $('login-msg').textContent = ''; $('login-pin').removeAttribute('aria-invalid'); }
    else if (v === 'home') renderHome();
    else if (v === 'scan') { if (state.scanKey) setScanMsg(state.scanKey); }
    else if (v === 'inspect' && state.current) rerenderInspect();
    else if (v === 'done') paintDone();
    else if (v === 'dashboard' && state.dash) renderDashboard();
    else if (v === 'log') renderLog();
    else if (v === 'print') paintPrintInfo();
    renderQueueBanner();
  }

  function toggleLang() { setLang(I.getLang() === 'th' ? 'en' : 'th'); }

  /* ============================== Theme (สว่าง/มืด) ============================== */

  function currentTheme() {
    var th = document.documentElement.getAttribute('data-theme');
    if (th === 'dark' || th === 'light') return th;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function updateThemeButtons() {
    var dark = currentTheme() === 'dark';
    var label = t(dark ? 'theme.toLight' : 'theme.toDark');
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) {
      b.setAttribute('aria-label', label);
      b.setAttribute('title', label);
      b.setAttribute('aria-pressed', String(dark));
    });
  }
  function toggleTheme() {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    lsSet(LS.THEME, next);
    updateThemeButtons();
  }

  /* ============================== Init ============================== */

  function bind() {
    $('login-btn').addEventListener('click', doLogin);
    $('login-pin').addEventListener('input', function () { this.removeAttribute('aria-invalid'); });
    $('login-pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    $('home-scan').addEventListener('click', startScan);
    $('manual-go').addEventListener('click', goManual);
    $('manual-id').addEventListener('keydown', function (e) { if (e.key === 'Enter') goManual(); });
    $('home-log').addEventListener('click', showLog);
    $('home-print').addEventListener('click', showPrint);
    $('scan-cancel').addEventListener('click', function () { renderHome(); show('home'); });
    $('scan-file').addEventListener('change', onScanFile);
    $('scan-retry').addEventListener('click', startScan);
    $('view-inspect').addEventListener('click', onInspectClick);
    $('view-inspect').addEventListener('change', onInspectChange);
    $('view-done').addEventListener('click', function (e) {
      if (e.target.closest('#done-next')) startScan();
      else if (e.target.closest('#done-home')) { renderHome(); show('home'); }
    });
    $('home-failed').addEventListener('click', function (e) {
      if (e.target.closest('#failed-clear')) { lsDel(LS.FAILED); renderFailed(); }
    });
    $('queue-banner').addEventListener('click', function (e) {
      if (e.target.closest('#queue-send')) {
        if (navigator.onLine === false) { toast(t('queue.stillOffline')); return; }
        flushQueue();
      }
    });
    $('dash-refresh').addEventListener('click', function () { loadDashboard(true); });
    $('f-building').addEventListener('change', function (e) { state.dashFilter.building = e.target.value; state.dashFilter.floor = ''; renderDashboard(); });
    $('f-floor').addEventListener('change', function (e) { state.dashFilter.floor = e.target.value; renderDashboard(); });
    $('view-dashboard').addEventListener('click', function (e) {
      var l = e.target.closest('[data-list]');
      if (l) { state.dashFilter.list = l.getAttribute('data-list'); renderDashboard(); return; }
      var h = e.target.closest('[data-hist]');
      if (h) openHistory(h.getAttribute('data-hist'));
    });
    $('log-month').addEventListener('change', loadLog);
    $('log-search').addEventListener('input', renderLog);
    document.addEventListener('click', function (e) {
      var ph = e.target.closest('[data-photo]');
      if (ph) openPhoto(ph.getAttribute('data-photo'));
    });
    $('print-building').addEventListener('change', loadPrint);
    $('print-go').addEventListener('click', function () { window.print(); });
    $('print-back').addEventListener('click', function () { renderHome(); show('home'); });
    $('modal-close').addEventListener('click', closeModal);
    document.addEventListener('keydown', onModalKey);
    $('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
      b.addEventListener('click', function () { onNav(b.getAttribute('data-nav')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang-toggle]'), function (b) { b.addEventListener('click', toggleLang); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) { b.addEventListener('click', toggleTheme); });
    window.addEventListener('online', updateNet);
    window.addEventListener('offline', updateNet);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && state.view === 'dashboard') loadDashboard();
    });
    setInterval(function () {
      if (state.view === 'dashboard' && document.visibilityState === 'visible') loadDashboard();
    }, 60000);
    setInterval(function () { if (navigator.onLine !== false) flushQueue(); }, 30000);
  }

  function init() {
    I.applyStatic();
    bind();
    updateThemeButtons();
    detectInApp();
    updateNet();
    var token = lsGet(LS.TOKEN, null);
    var exp = lsGet(LS.EXP, 0);
    var user = lsGet(LS.USER, null);
    if (token && user && exp > Date.now() + 60000) {
      state.token = token;
      state.user = user;
      state.cache = lsGet(LS.CACHE, null);
      afterLogin();
    } else {
      updateChrome();
      showLogin();
    }
  }

  init();
})();
</script>
